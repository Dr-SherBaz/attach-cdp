name: Feature request
description: Suggest a command, flag or integration
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the workflow, not the implementation.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like it to do?
    validations:
      required: true
  - type: checkboxes
    id: constraints
    attributes:
      label: Project constraints
      options:
        - label: This can be done without adding a runtime dependency
          required: false
